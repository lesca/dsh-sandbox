services:
  dsh-sandbox:
    extends:
      file: ../docker-compose.base.yaml
      service: dsh-sandbox
    image: lesca/dsh-sandbox:x86_64
    build:
      args:
        - SOURCE_FILE=ubuntu.sources
        - HTTPS_PROXY=http://172.17.0.1:7070
    volumes:
      - /share/public/models:/models
    environment:
      - HF_HOME=/models/huggingface
      - MODELSCOPE_CACHE=/models/modelscope
      - MS_CACHE_HOME=/models/modelscope
    env_file:
      - ../dsh-proxy.env
