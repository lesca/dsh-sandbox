services:
  dsh-sandbox:
    extends:
      file: ../x86_64/docker-compose.yaml
      service: dsh-sandbox

  cuda:
    container_name: cuda-dev
    # image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    # image: nvidia/cuda:12.8.1-runtime-ubuntu24.04
    image: nvidia/cuda:12.9.2-cudnn-devel-ubuntu24.04
    # image: nvidia/cuda:12.9.2-runtime-ubuntu24.04

    stop_signal: SIGINT
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /share/public/models:/models:ro
    env_file:
      - ../dsh-proxy.env
    # command: /usr/sbin/sshd -D
    command: sleep infinity
    # 启用特权模式或 GPU 支持（如果你的 Dockerfile 需要 NVIDIA CUDA 支持）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
