services:
  dsh-sandbox:
    extends:
      file: ../x86_64/docker-compose.yaml
      service: dsh-sandbox

  ninfer-v100:
    extends:
      file: ../x86_64_ninfer_v100/docker-compose.yaml
      service: ninfer-v100

  comfyui-v100:
    container_name: comfyui-v100
    image: lesca/comfyui-v100:latest
    stop_signal: SIGINT
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../dsh-proxy.env
    environment:
      - TZ=Asia/Shanghai
    user: "1000:1001"
    volumes:
      - /share/public/models/comfyui:/opt/comfyui/models
      - /share/public/comfyui/user:/opt/comfyui/user
      - /share/public/comfyui/media:/opt/comfyui/input
      - /share/public/comfyui/media:/opt/comfyui/output
      - /share/public/comfyui/custom_nodes:/opt/comfyui/custom_nodes:slave
      # - ./entrypoint.sh:/usr/local/bin/entrypoint.sh
    ports:
      - "8188:8188"
    # command: sleep infinity
    # 启用特权模式或 GPU 支持（如果你的 Dockerfile 需要 NVIDIA CUDA 支持）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]