services:
  dsh-sandbox:
    extends:
      file: ../docker-compose.base.yaml
      service: dsh-sandbox
    build:
      args:
        - BASE_IMAGE=ubuntu:24.04
        - SOURCE_FILE=ubuntu.sources
        - HTTPS_PROXY=http://172.17.0.1:7070
    volumes:
      - /share/public/models:/models
    environment:
      - HF_HOME=/models/huggingface
      - MODELSCOPE_CACHE=/models/modelscope
      - MS_CACHE_HOME=/models/modelscope
    env_file:
      - ../dsh-proxy.env

  comfyui-v100:
    container_name: comfyui-v100
    image: lesca/comfyui-v100:latest
    stop_signal: SIGINT
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../dsh-proxy.env
    environment:
      - TZ=Asia/Shanghai
    user: "1000:1001"
    volumes:
      - /share/public/models/comfyui:/opt/comfyui/models
      - /share/public/comfyui/user:/opt/comfyui/user
      - /share/public/comfyui/media:/opt/comfyui/input
      - /share/public/comfyui/media:/opt/comfyui/output
      - /share/public/comfyui/custom_nodes:/opt/comfyui/custom_nodes:slave
      # - ./entrypoint.sh:/usr/local/bin/entrypoint.sh
    ports:
      - "8188:8188"
    # command: sleep infinity
    # 启用特权模式或 GPU 支持（如果你的 Dockerfile 需要 NVIDIA CUDA 支持）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

