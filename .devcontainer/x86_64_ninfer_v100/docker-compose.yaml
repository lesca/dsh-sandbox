services:
  dsh-sandbox:
    extends:
      file: ../x86_64/docker-compose.yaml
      service: dsh-sandbox

  ninfer-v100:
    container_name: ninfer-v100
    image: lesca/ninfer-v100-sm70:latest
    stop_signal: SIGINT
    environment:
      - TZ=Asia/Shanghai
      #- MODEL=/models/ninfer/qwen3_8_27b_nvfp4.ninfer # general
      # - MODEL=/models/ninfer/qwen3_8_27b_merkyor_coder390_w4a4_nvfp4.ninfer # coder390: code token少
      # - MODEL=/models/ninfer/qwen3_8_27b_pi_nvfp4.ninfer # pi: code 工作流 工具调用
      - MODEL=/models/ninfer/qwen3_8_27b_omnimerge_v6_nvfp4.ninfer # mannix-ita/omnimerge-v6: code 工具调用 结构化输出 编程长任务
      # - MODEL=/models/ninfer/qwen3_8_27b_arex2_nvfp4.ninfer # baai/arex2: 编程长任务 工作流
      - MAX_CONCURRENCY=1
      - MAX_CONTEXT=240000
      # - NINFER_ARGS=--no-thinking
      - NINFER_ARGS=--no-thinking --lookup-policy adaptive --lookup-min-suffix 4 # ninfer-v100-sm70
    volumes:
      - /share/public/models:/models:ro
    # command: /usr/sbin/sshd -D
    ports:
      - "18080:18080"
      - "18081:18081"
    # command: sleep infinity
    # 启用特权模式或 GPU 支持（如果你的 Dockerfile 需要 NVIDIA CUDA 支持）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
