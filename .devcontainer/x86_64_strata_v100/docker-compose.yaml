services:
  dsh-sandbox:
    extends:
      file: ../docker-compose.base.yaml
      service: dsh-sandbox
    build:
      args:
        - BASE_IMAGE=ubuntu:24.04
        - SOURCE_FILE=ubuntu.sources
        - HTTPS_PROXY=http://172.17.0.1:7070
    volumes:
      - /share/public/models:/models
    environment:
      - HF_HOME=/models/huggingface
      - MODELSCOPE_CACHE=/models/modelscope
      - MS_CACHE_HOME=/models/modelscope
    env_file:
      - ../dsh-proxy.env

  strata-v100:
    container_name: strata-v100
    image: lesca/strata-v100:latest
    stop_signal: SIGINT
    environment:
      - TZ=Asia/Shanghai
      - HF_ENDPOINT=https://hf-mirror.com
      # - FAMILY=swift
      # - FAMILY=qwen
      # - MODEL=IQ2_XS
      - MODEL=IQ3_S
      - CONTEXT=200000
      - VISION=yes
    volumes:
      - /share/public/models/strata:/data
    #   - ./entrypoint.sh:/usr/local/bin/entrypoint.sh
    # command: sleep infinity
    ports:
      - "18080:18080"
    # command: sleep infinity
    # 启用特权模式或 GPU 支持（如果你的 Dockerfile 需要 NVIDIA CUDA 支持）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]