services:
  dsh-sandbox:
    build:
      context: ..
      dockerfile: general/Dockerfile
      args:
        - TZ=Asia/Shanghai
        - HTTPS_PROXY=http://172.17.0.1:7070
        - USERNAME=ubuntu
    command: sleep infinity
    volumes:
      - ../..:/workspace:cached,slave
      - ../../.dsh:/home/ubuntu/.dsh
      - ../post-install.sh:/opt/post-install.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../proxy.env
      - ../dsh.env
    environment:
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY
      - DEEPSEEK_BASE_URL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # 启用特权模式或 GPU 支持（如果你的 Dockerfile 需要 NVIDIA CUDA 支持）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
