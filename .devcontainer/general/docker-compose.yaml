services:
  dsh-sandbox:
    build:
      context: ..
      dockerfile: general/Dockerfile
      args:
        - TZ=Asia/Shanghai
        # - HTTPS_PROXY=http://172.17.0.1:7070
        - USERNAME=ubuntu
    command: sleep infinity
    volumes:
      - ../..:/workspace:cached,slave
      - ../post-install.sh:/opt/post-install.sh
      - $HOME/.dsh:/home/ubuntu/.dsh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      # - HTTPS_PROXY=http://host.docker.internal:7070
      # - HTTP_PROXY=http://host.docker.internal:7070
      # - NO_PROXY=127.0.0.1,localhost,192.168.0.0/16
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # 启用特权模式或 GPU 支持（如果你的 Dockerfile 需要 NVIDIA CUDA 支持）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
